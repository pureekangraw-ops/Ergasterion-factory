<body>
<div class="wrap">
<header><h1>MIMIR V1</h1><p>Static mobile proof — one registry, one gate, one truth.</p></header>
<section class="card"><h2>Catalog</h2><input id="search" placeholder="Search capability, type, route..."><div id="catalog"></div></section>
<section class="card"><h2>Ask MIMIR</h2><label>Intent</label><input id="intent" value="modify repository file"><label>Requested result</label><input id="result" value="update a file in Go-Calalog-"><label>Required action</label><input id="action" value="update_file"><label>Surface</label><input id="surface" value="ChatGPT GitHub connector"><div class="actions"><button id="runBtn">Run MIMIR</button><button id="passProbe">PASS probe</button><button id="waitProbe">WAIT probe</button></div><div id="answer"></div></section>
<section class="card"><h2>Proof target</h2><p>Capability · Callable Action · Permission · Availability</p><small>Owner verification required before V1 is called verified.</small></section>
</div>
