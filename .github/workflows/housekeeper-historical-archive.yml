name: Housekeeper Historical Archive

on:
  push:
    branches:
      - 'housekeeping/archive-historical-docs-20260920-catalog'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build historical archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf 'housekeeper-catalog-historical-docs-20260920.tar.gz' \
      'docs/superpowers/plans/2026-09-13-mimir-first-vertical-slice.md' \
      'docs/superpowers/plans/2026-09-13-mimir-static-mobile-deviation.md' \
      'docs/superpowers/plans/2026-09-13-owner-logic-seal-v1.md' \
      'docs/superpowers/specs/2026-09-13-mimir-first-vertical-slice-design.md' \
      'docs/superpowers/specs/2026-09-13-owner-logic-seal-v1-design.md' \
      'docs/verification/2026-09-13-mimir-v1-mobile-proof.md' \
      'docs/verification/2026-09-13-mimir-v1-owner-mobile-proof.md' \
      'docs/verification/2026-09-13-owner-logic-seal-v1-mobile-proof.md'
          sha256sum 'housekeeper-catalog-historical-docs-20260920.tar.gz' > 'housekeeper-catalog-historical-docs-20260920.tar.gz.sha256'
          printf 'repository=%s\nbranch=%s\ncommit=%s\n' 'pureekangraw-ops/Go-Calalog-' 'housekeeping/archive-historical-docs-20260920-catalog' "$GITHUB_SHA" > ARCHIVE-METADATA.txt
      - name: Upload historical archive
        uses: actions/upload-artifact@v4
        with:
          name: 'housekeeper-catalog-historical-docs-20260920'
          path: |
            housekeeper-catalog-historical-docs-20260920.tar.gz
            housekeeper-catalog-historical-docs-20260920.tar.gz.sha256
            ARCHIVE-METADATA.txt
          if-no-files-found: error
          retention-days: 30
