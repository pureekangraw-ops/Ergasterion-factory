name: Deploy ERGASTERION Factory Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-deploy.yml'

permissions:
  contents: read

concurrency:
  group: ergasterion-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy Factory Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Sync Factory runtime Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx --yes wrangler@4 secret put CLOUDFLARE_API_TOKEN --config wrangler.jsonc
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx --yes wrangler@4 secret put CLOUDFLARE_ACCOUNT_ID --config wrangler.jsonc

      - name: Verify Factory runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments list --config wrangler.jsonc
