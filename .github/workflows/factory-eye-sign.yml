name: Firefox Factory Eye — AMO Sign

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-eye-amo-sign
  cancel-in-progress: false

jobs:
  sign_unlisted:
    name: Sign unlisted XPI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refuse non-main signing
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Factory Eye signing is restricted to main. Selected ref: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Read Factory Eye identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';

          const manifestPath = 'pixie-lab-v1/browser-adapter/firefox-tab-observer/manifest.json';
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          const id = manifest.browser_specific_settings?.gecko?.id;
          const version = manifest.version;

          if (!id) throw new Error('FIREFOX_EXTENSION_ID_MISSING');
          if (!version) throw new Error('FIREFOX_EXTENSION_VERSION_MISSING');

          const output = process.env.GITHUB_OUTPUT;
          await appendFile(output, `extension_id=${id}\nversion=${version}\n`);
          console.log(`Factory Eye ${version} · ${id}`);
          NODE

      - name: AMO credential preflight
        shell: bash
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${FIREFOX_JWT_ISSUER:-}" ]; then
            echo "::error::Missing GitHub Actions secret FIREFOX_JWT_ISSUER"
            exit 1
          fi
          if [ -z "${FIREFOX_JWT_SECRET:-}" ]; then
            echo "::error::Missing GitHub Actions secret FIREFOX_JWT_SECRET"
            exit 1
          fi
          echo "AMO credentials are configured."

      - name: Lint Firefox Factory Eye
        shell: bash
        run: |
          set -euo pipefail
          npx --yes web-ext@10.7.0 lint             --source-dir pixie-lab-v1/browser-adapter/firefox-tab-observer             --no-config-discovery

      - name: Sign unlisted extension with Mozilla AMO
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          WEB_EXT_AMO_BASE_URL: https://addons.mozilla.org/api/v5/
          WEB_EXT_CHANNEL: unlisted
          WEB_EXT_SOURCE_DIR: pixie-lab-v1/browser-adapter/firefox-tab-observer
          WEB_EXT_ARTIFACTS_DIR: ${{ runner.temp }}/factory-eye-signed
          WEB_EXT_NO_INPUT: "true"
          WEB_EXT_TIMEOUT: "300000"
          WEB_EXT_APPROVAL_TIMEOUT: "900000"
        run: |
          set -euo pipefail
          mkdir -p "$WEB_EXT_ARTIFACTS_DIR"
          npx --yes web-ext@10.7.0 sign             --source-dir "$WEB_EXT_SOURCE_DIR"             --artifacts-dir "$WEB_EXT_ARTIFACTS_DIR"             --channel "$WEB_EXT_CHANNEL"             --amo-base-url "$WEB_EXT_AMO_BASE_URL"             --timeout "$WEB_EXT_TIMEOUT"             --approval-timeout "$WEB_EXT_APPROVAL_TIMEOUT"             --no-input

          signed_xpi="$(find "$WEB_EXT_ARTIFACTS_DIR" -maxdepth 1 -type f -name '*.xpi' -print -quit)"
          if [ -z "$signed_xpi" ]; then
            echo "::error::Mozilla signing completed without a signed XPI artifact"
            exit 1
          fi

          cp "$signed_xpi" "$RUNNER_TEMP/ergasterion-factory-eye-v${{ steps.identity.outputs.version }}-signed.xpi"

      - name: Create signed provenance
        shell: bash
        env:
          EXTENSION_ID: ${{ steps.identity.outputs.extension_id }}
          EXTENSION_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          xpi="$RUNNER_TEMP/ergasterion-factory-eye-v${EXTENSION_VERSION}-signed.xpi"
          sha256="$(sha256sum "$xpi" | awk '{print $1}')"
          size="$(stat -c '%s' "$xpi")"

          EXT_SHA256="$sha256" EXT_SIZE="$size" node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const provenance = {
            schema: 'ERGASTERION_FIREFOX_SIGNED_PROVENANCE_V1',
            extensionId: process.env.EXTENSION_ID,
            version: process.env.EXTENSION_VERSION,
            channel: 'unlisted',
            amoBaseUrl: 'https://addons.mozilla.org/api/v5/',
            signingTool: 'web-ext@10.7.0',
            sourceRepository: process.env.GITHUB_REPOSITORY,
            sourceRef: process.env.GITHUB_REF,
            sourceSha: process.env.GITHUB_SHA,
            signedXpiSha256: process.env.EXT_SHA256,
            signedXpiSizeBytes: Number(process.env.EXT_SIZE),
            createsAuthority: false,
          };
          await writeFile(
            process.env.RUNNER_TEMP + '/factory-eye-signed-provenance.json',
            JSON.stringify(provenance, null, 2) + '\n',
          );
          console.log(JSON.stringify(provenance, null, 2));
          NODE

      - name: Upload signed Factory Eye
        uses: actions/upload-artifact@v4
        with:
          name: ergasterion-factory-eye-v${{ steps.identity.outputs.version }}-signed
          path: |
            ${{ runner.temp }}/ergasterion-factory-eye-v${{ steps.identity.outputs.version }}-signed.xpi
            ${{ runner.temp }}/factory-eye-signed-provenance.json
          if-no-files-found: error
          retention-days: 30
