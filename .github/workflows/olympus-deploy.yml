name: Factory Deploy OLYMPUS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/olympus-deploy.yml'

permissions:
  contents: read

concurrency:
  group: factory-olympus-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy-and-live-e2e:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API: https://api.cloudflare.com/client/v4
      OLYMPUS_URL: https://olympus.pureekangraw.workers.dev
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v4

      - name: Checkout OLYMPUS main
        uses: actions/checkout@v4
        with:
          repository: pureekangraw-ops/Olympus
          ref: main
          path: olympus

      - name: Verify Factory Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=1"             | jq -e '.success == true' >/dev/null

      - name: Ensure OLYMPUS_STATE namespace
        id: prod_kv
        shell: bash
        run: |
          set -euo pipefail
          list="$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100")"
          id="$(printf '%s' "$list" | jq -r '.result[]? | select(.title=="OLYMPUS_STATE") | .id' | head -n1)"
          if [ -z "$id" ]; then
            created="$(curl -fsS -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data '{"title":"OLYMPUS_STATE"}'               "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")"
            printf '%s' "$created" | jq -e '.success == true' >/dev/null
            id="$(printf '%s' "$created" | jq -r '.result.id')"
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy OLYMPUS production runtime
        shell: bash
        working-directory: olympus
        env:
          OLYMPUS_KV_ID: ${{ steps.prod_kv.outputs.id }}
        run: |
          set -euo pipefail
          cat > wrangler.factory.generated.jsonc <<EOF
          {
            "name": "olympus",
            "main": "cloudflare/worker.mjs",
            "compatibility_date": "2026-10-01",
            "workers_dev": true,
            "routes": [
              { "pattern": "olympus.yggmetro.com", "custom_domain": true }
            ],
            "kv_namespaces": [
              { "binding": "OLYMPUS_STATE", "id": "$OLYMPUS_KV_ID" }
            ]
          }
          EOF
          npx --yes wrangler@4 deploy --config wrangler.factory.generated.jsonc

      - name: Verify production health and AION surface
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 12); do
            if health="$(curl -fsS "$OLYMPUS_URL/health" 2>/dev/null)" &&
               printf '%s' "$health" | jq -e '.ok == true and .runtime == "CLOUDFLARE_WORKER" and .storage == true and .aion == true' >/dev/null &&
               curl -fsS "$OLYMPUS_URL/registry/current" | jq -e '.authority == "CURRENT_VERSION_REGISTRY"' >/dev/null &&
               curl -fsS "$OLYMPUS_URL/aion/registry" | jq -e '.schema == "AION_TRUST_PROOF_V1"' >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"

      - name: Create isolated E2E KV
        id: e2e
        shell: bash
        run: |
          set -euo pipefail
          title="OLYMPUS_E2E_${GITHUB_RUN_ID}"
          worker="olympus-e2e-${GITHUB_RUN_ID}"
          created="$(curl -fsS -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data "$(jq -cn --arg title "$title" '{title:$title}')"             "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")"
          printf '%s' "$created" | jq -e '.success == true' >/dev/null
          id="$(printf '%s' "$created" | jq -r '.result.id')"
          echo "kv_id=$id" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "E2E_KV_ID=$id" >> "$GITHUB_ENV"
          echo "E2E_WORKER=$worker" >> "$GITHUB_ENV"
          echo "E2E_URL=https://$worker.pureekangraw.workers.dev" >> "$GITHUB_ENV"

      - name: Deploy isolated E2E runtime
        shell: bash
        working-directory: olympus
        env:
          E2E_KV_ID: ${{ steps.e2e.outputs.kv_id }}
          E2E_WORKER: ${{ steps.e2e.outputs.worker }}
        run: |
          set -euo pipefail
          cat > wrangler.e2e.generated.jsonc <<EOF
          {
            "name": "$E2E_WORKER",
            "main": "cloudflare/worker.mjs",
            "compatibility_date": "2026-10-01",
            "kv_namespaces": [
              { "binding": "OLYMPUS_STATE", "id": "$E2E_KV_ID" }
            ]
          }
          EOF
          npx --yes wrangler@4 deploy --config wrangler.e2e.generated.jsonc

      - name: Run live AION E2E migration gate
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 12); do
            if curl -fsS "$E2E_URL/health" | jq -e '.ok == true and .aion == true' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
          post() { curl --retry 12 --retry-delay 5 --retry-all-errors -fsS -X POST -H 'Content-Type: application/json' --data "$2" "$E2E_URL$1"; }

          post /apps '{"appId":"prism","destination":"PRISM_NATIVE","integration":{"mode":"DIRECT","connectionPoint":{"appId":"prism","target":"app://prism-owner","releaseTruthRef":"truth://prism","direct":true}}}' >/dev/null
          missing_profile='{"appId":"missing","destination":"MISSING_NATIVE","integration":{"mode":"DIRECT","connectionPoint":{"appId":"missing","target":"app://missing-owner","releaseTruthRef":"truth://missing","direct":true}}}'
          post /apps "$missing_profile" >/dev/null

          missing="$(post /aion/resolve '{"appId":"missing","version":"1","sourceRevision":"r","artifactSha":"a","destination":"MISSING_NATIVE"}')"
          printf '%s' "$missing" | jq -e '.status=="UNKNOWN" and .target==null and .releaseTruthRef==null' >/dev/null

          post /reports/current '{"appId":"prism","version":"1.0.0","sourceRevision":"rev-1","artifactSha":"sha-1","runtimeIdentity":"worker://1","owner":"PRISM","provenanceRef":"truth://prism","destination":"PRISM_NATIVE","verified":true,"evidence":["live-e2e://v1"]}' >/dev/null
          verified1="$(post /aion/resolve '{"appId":"prism","version":"1.0.0","sourceRevision":"rev-1","artifactSha":"sha-1","destination":"PRISM_NATIVE"}')"
          printf '%s' "$verified1" | jq -e '.status=="VERIFIED" and .target=="app://prism-owner"' >/dev/null

          mismatch="$(post /aion/resolve '{"appId":"prism","version":"1.0.0","sourceRevision":"rev-1","artifactSha":"wrong","destination":"PRISM_NATIVE"}')"
          printf '%s' "$mismatch" | jq -e '.status=="MISMATCH" and .target==null and .releaseTruthRef==null' >/dev/null

          post /reports/current '{"appId":"prism","version":"2.0.0","sourceRevision":"rev-2","artifactSha":"sha-2","runtimeIdentity":"worker://2","owner":"PRISM","provenanceRef":"truth://prism","destination":"PRISM_NATIVE","verified":true,"evidence":["live-e2e://v2"]}' >/dev/null
          stale="$(post /aion/resolve '{"appId":"prism","version":"1.0.0","sourceRevision":"rev-1","artifactSha":"sha-1","destination":"PRISM_NATIVE"}')"
          printf '%s' "$stale" | jq -e '.status=="STALE" and .target==null and .releaseTruthRef==null' >/dev/null

          post /reports/current '{"appId":"prism","version":"1.0.0","sourceRevision":"rev-1","artifactSha":"sha-1","runtimeIdentity":"worker://1-rollback","owner":"PRISM","provenanceRef":"truth://prism","destination":"PRISM_NATIVE","verified":true,"evidence":["live-e2e://rollback"]}' >/dev/null
          rolled="$(post /aion/resolve '{"appId":"prism","version":"1.0.0","sourceRevision":"rev-1","artifactSha":"sha-1","destination":"PRISM_NATIVE"}')"
          printf '%s' "$rolled" | jq -e '.status=="VERIFIED" and .target=="app://prism-owner"' >/dev/null

          registry="$(curl --retry 12 --retry-delay 5 --retry-all-errors -fsS "$E2E_URL/aion/registry")"
          printf '%s' "$registry" | jq -e '.entries[] | select(.systemId=="prism") | .currentStatus=="CURRENT" and .target=="app://prism-owner"' >/dev/null
          printf '%s' "$registry" | jq -e '.entries[] | select(.systemId=="missing") | .currentStatus=="UNKNOWN" and .target==null and .releaseTruthRef==null' >/dev/null

      - name: Cleanup isolated E2E resources
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${E2E_WORKER:-}" ]; then
            curl -fsS -X DELETE               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$E2E_WORKER" >/dev/null
          fi
          if [ -n "${E2E_KV_ID:-}" ]; then
            curl -fsS -X DELETE               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$E2E_KV_ID" >/dev/null
          fi
