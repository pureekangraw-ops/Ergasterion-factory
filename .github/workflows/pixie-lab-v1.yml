name: PIXIE LAB V1 Core

on:
  pull_request:
    paths:
      - 'pixie-lab-v1/**'
      - '.github/workflows/pixie-lab-v1.yml'
  push:
    branches:
      - main
      - 'pixie-lab-v1-core-*'
    paths:
      - 'pixie-lab-v1/**'
      - '.github/workflows/pixie-lab-v1.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pixie-lab-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
