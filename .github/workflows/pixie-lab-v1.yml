name: ERGASTERION Idea Workspace

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Stable GO Hub request id
        required: true
        type: string
      command_json:
        description: PIXIE command envelope JSON
        required: true
        type: string
  pull_request:
    paths:
      - 'pixie-lab-v1/**'
      - '.github/workflows/pixie-lab-v1.yml'
  push:
    branches:
      - main
      - 'pixie-lab-v1-core-*'
      - 'pixie-runtime-command-*'
    paths:
      - 'pixie-lab-v1/**'
      - '.github/workflows/pixie-lab-v1.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pixie-lab-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

      - name: Smoke ERGASTERION command persistence
        shell: bash
        run: |
          set -euo pipefail
          export PIXIE_STATE_FILE="$RUNNER_TEMP/ergasterion-smoke-state.json"

          node cli.mjs capabilities > "$RUNNER_TEMP/capabilities.json"
          node cli.mjs '{"command":"idea_create","args":{"ideaId":"IDEA-SMOKE","title":"Smoke","intent":"verify persisted command surface","requestedResult":"state survives across commands","workId":"WORK-SMOKE","checkpointId":"CP-SMOKE"}}' > "$RUNNER_TEMP/idea.json"
          node cli.mjs '{"command":"experiment_create","args":{"experimentId":"EXP-SMOKE","ideaId":"IDEA-SMOKE","kind":"APP","goal":"exercise app experiment"}}' > "$RUNNER_TEMP/experiment.json"
          node cli.mjs '{"command":"variant_create","args":{"variantId":"VAR-SMOKE","experimentId":"EXP-SMOKE","spec":{"screen":"home"}}}' > "$RUNNER_TEMP/variant.json"
          node cli.mjs '{"command":"app_prototype_create","args":{"prototypeId":"APP-SMOKE","experimentId":"EXP-SMOKE","variantId":"VAR-SMOKE","spec":{"kind":"web"}}}' > "$RUNNER_TEMP/app.json"
          node cli.mjs '{"command":"runtime_record","args":{"observationId":"OBS-SMOKE","prototypeId":"APP-SMOKE","experimentId":"EXP-SMOKE","variantId":"VAR-SMOKE","workId":"WORK-SMOKE","checkpointId":"CP-SMOKE","targetRef":"app://smoke","observedRef":"observer://smoke","status":"PASS","screenshotRefs":["screenshot://smoke"],"evidenceRefs":["evidence://runtime-smoke"],"source":"BROWSER_OBSERVER"}}' > "$RUNNER_TEMP/runtime-record.json"
          node cli.mjs '{"command":"runtime_interaction_record","args":{"interactionId":"INT-SMOKE","observationId":"OBS-SMOKE","workId":"WORK-SMOKE","checkpointId":"CP-SMOKE","targetRef":"app://smoke","action":{"type":"CLICK","target":"#continue"},"result":"PASS","evidenceRefs":["evidence://runtime-click"],"source":"LIGHTHOUSE_CONTROL_PORT"}}' > "$RUNNER_TEMP/runtime-interaction.json"
          node cli.mjs '{"command":"production_handoff_prepare","args":{"handoffId":"PROD-SMOKE","experimentId":"EXP-SMOKE","variantId":"VAR-SMOKE","workId":"WORK-SMOKE","checkpointId":"CP-SMOKE","requestedResult":"verify candidate"}}' > "$RUNNER_TEMP/production-handoff.json"

          node cli.mjs '{"command":"visual_create","args":{"visualDraftId":"VIS-SMOKE","sourceRef":"image://smoke","spec":{"subject":"smoke"}}}' > "$RUNNER_TEMP/visual.json"
          node cli.mjs '{"command":"visual_render_packet","args":{"visualDraftId":"VIS-SMOKE","packet":{"packetId":"PACK-SMOKE","intent":"smoke render bridge","requestedResult":"one test artifact"}}}' > "$RUNNER_TEMP/packet.json"
          node cli.mjs '{"command":"image_request","args":{"packetId":"PACK-SMOKE","request":{"actionId":"IMG-SMOKE","workId":"WORK-SMOKE","checkpointId":"CP-SMOKE"}}}' > "$RUNNER_TEMP/request.json"
          node cli.mjs '{"command":"image_result","args":{"actionId":"IMG-SMOKE","result":{"status":"ARTIFACT_RETURNED","artifactRef":"image://smoke-result","receiptRef":"receipt://smoke","evidenceRefs":["evidence://smoke"]}}}' > "$RUNNER_TEMP/result.json"
          node cli.mjs '{"command":"visual_crew_create","args":{"taskId":"CREW-SMOKE","workId":"WORK-SMOKE","checkpointId":"CP-SMOKE","brief":"prepare theme asset","requestedOutput":"one candidate"}}' > "$RUNNER_TEMP/visual-crew-create.json"
          node cli.mjs '{"command":"visual_crew_result","args":{"taskId":"CREW-SMOKE"}}' > "$RUNNER_TEMP/visual-crew-result.json"

          node cli.mjs status > "$RUNNER_TEMP/status.json"
          node cli.mjs workbench_floor > "$RUNNER_TEMP/workbench-floor.json"
          node cli.mjs '{"command":"workbench_open","args":{"workbenchId":"VISUAL_WORKBENCH"}}' > "$RUNNER_TEMP/workbench-open.json"
          node cli.mjs checkpoint_dock > "$RUNNER_TEMP/checkpoint-dock.json"
          node cli.mjs reality_screen > "$RUNNER_TEMP/reality-screen.json"
          node cli.mjs big_view > "$RUNNER_TEMP/big-view.json"
          node cli.mjs intent_review > "$RUNNER_TEMP/intent-review.json"
          node cli.mjs coding_status > "$RUNNER_TEMP/coding-status.json"
          node cli.mjs '{"command":"coding_read","args":{"path":"README.md"}}' > "$RUNNER_TEMP/coding-read.json"
          node cli.mjs '{"command":"coding_search","args":{"query":"ERGASTERION","path":"README.md"}}' > "$RUNNER_TEMP/coding-search.json"
          node cli.mjs runtime_status > "$RUNNER_TEMP/runtime-status.json"
          node cli.mjs '{"command":"runtime_view","args":{"selector":{"workId":"WORK-SMOKE","checkpointId":"CP-SMOKE","prototypeId":"APP-SMOKE"}}}' > "$RUNNER_TEMP/runtime-view.json"

          STATUS_FILE="$RUNNER_TEMP/status.json" CAP_FILE="$RUNNER_TEMP/capabilities.json" FLOOR_FILE="$RUNNER_TEMP/workbench-floor.json" OPEN_FILE="$RUNNER_TEMP/workbench-open.json" DOCK_FILE="$RUNNER_TEMP/checkpoint-dock.json" REALITY_FILE="$RUNNER_TEMP/reality-screen.json" BIG_FILE="$RUNNER_TEMP/big-view.json" INTENT_FILE="$RUNNER_TEMP/intent-review.json" CODING_STATUS_FILE="$RUNNER_TEMP/coding-status.json" CODING_READ_FILE="$RUNNER_TEMP/coding-read.json" CODING_SEARCH_FILE="$RUNNER_TEMP/coding-search.json" RUNTIME_STATUS_FILE="$RUNNER_TEMP/runtime-status.json" RUNTIME_VIEW_FILE="$RUNNER_TEMP/runtime-view.json" VISUAL_CREW_CREATE_FILE="$RUNNER_TEMP/visual-crew-create.json" VISUAL_CREW_RESULT_FILE="$RUNNER_TEMP/visual-crew-result.json" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const status = JSON.parse(await readFile(process.env.STATUS_FILE, 'utf8'));
          const capabilities = JSON.parse(await readFile(process.env.CAP_FILE, 'utf8'));
          const floor = JSON.parse(await readFile(process.env.FLOOR_FILE, 'utf8'));
          const open = JSON.parse(await readFile(process.env.OPEN_FILE, 'utf8'));
          const dock = JSON.parse(await readFile(process.env.DOCK_FILE, 'utf8'));
          const reality = JSON.parse(await readFile(process.env.REALITY_FILE, 'utf8'));
          const big = JSON.parse(await readFile(process.env.BIG_FILE, 'utf8'));
          const intent = JSON.parse(await readFile(process.env.INTENT_FILE, 'utf8'));
          const codingStatus = JSON.parse(await readFile(process.env.CODING_STATUS_FILE, 'utf8'));
          const codingRead = JSON.parse(await readFile(process.env.CODING_READ_FILE, 'utf8'));
          const codingSearch = JSON.parse(await readFile(process.env.CODING_SEARCH_FILE, 'utf8'));
          const runtimeStatus = JSON.parse(await readFile(process.env.RUNTIME_STATUS_FILE, 'utf8'));
          const runtimeView = JSON.parse(await readFile(process.env.RUNTIME_VIEW_FILE, 'utf8'));
          const visualCrewCreate = JSON.parse(await readFile(process.env.VISUAL_CREW_CREATE_FILE, 'utf8'));
          const visualCrewResult = JSON.parse(await readFile(process.env.VISUAL_CREW_RESULT_FILE, 'utf8'));

          if (!status.ok) throw new Error('STATUS_NOT_OK');
          if (status.result?.counts?.ideas !== 1) throw new Error('IDEA_PERSISTENCE_FAILED');
          if (status.result?.counts?.experiments !== 1) throw new Error('EXPERIMENT_PERSISTENCE_FAILED');
          if (status.result?.counts?.variants !== 1) throw new Error('VARIANT_PERSISTENCE_FAILED');
          if (status.result?.counts?.appPrototypes !== 1) throw new Error('APP_PERSISTENCE_FAILED');
          if (status.result?.counts?.productionHandoffs !== 1) throw new Error('PRODUCTION_HANDOFF_PERSISTENCE_FAILED');
          if (status.result?.runtime?.schemaVersion !== 'ERGASTERION_STATE_V2') throw new Error('STATE_SCHEMA_MIGRATION_FAILED');
          if (status.result?.counts?.imageActions !== 1) throw new Error('IMAGE_ACTION_PERSISTENCE_FAILED');
          if (status.result?.counts?.imageReceipts !== 1) throw new Error('IMAGE_RECEIPT_PERSISTENCE_FAILED');
          if (status.result?.counts?.runtimeObservations !== 1) throw new Error('RUNTIME_OBSERVATION_PERSISTENCE_FAILED');
          if (status.result?.counts?.runtimeInteractions !== 1) throw new Error('RUNTIME_INTERACTION_PERSISTENCE_FAILED');
          if (!visualCrewCreate.ok || visualCrewCreate.result?.taskId !== 'CREW-SMOKE') throw new Error('VISUAL_CREW_CREATE_COMMAND_FAILED');
          if (!visualCrewResult.ok || visualCrewResult.result?.taskId !== 'CREW-SMOKE') throw new Error('VISUAL_CREW_RESULT_COMMAND_FAILED');
          if (capabilities.result?.app?.id !== 'ERGASTERION') throw new Error('CAPABILITY_MANIFEST_FAILED');
          if (!floor.ok || floor.mutated !== false) throw new Error('WORKBENCH_FLOOR_COMMAND_FAILED');
          if (floor.result?.schema !== 'ERGASTERION_WORKBENCH_FLOOR_V1') throw new Error('WORKBENCH_FLOOR_SCHEMA_FAILED');
          if (floor.result?.labs?.experimental?.map((room) => room.roomId).join(',') !== 'ROOM-A,ROOM-B,ROOM-C') throw new Error('EXPERIMENTAL_LAB_BOUNDARY_FAILED');
          if (floor.result?.workbenches?.coding?.status !== 'HOST_DEPENDENT') throw new Error('CODING_HOST_TRUTH_FAILED');
          if (floor.result?.authority?.createsAuthority !== false) throw new Error('WORKBENCH_FLOOR_AUTHORITY_EXPANSION');
          if (!open.ok || open.mutated !== false) throw new Error('WORKBENCH_OPEN_COMMAND_FAILED');
          if (open.result?.workbenchId !== 'VISUAL_WORKBENCH') throw new Error('WORKBENCH_OPEN_VISUAL_FAILED');
          if (open.result?.authority?.createsAuthority !== false) throw new Error('WORKBENCH_OPEN_AUTHORITY_EXPANSION');
          if (!dock.ok || dock.mutated !== false || dock.result?.readOnly !== true) throw new Error('CHECKPOINT_DOCK_FAILED');
          if (dock.result?.createsWork !== false || dock.result?.createsAuthority !== false) throw new Error('CHECKPOINT_DOCK_SCOPE_EXPANSION');
          if (!reality.ok || reality.mutated !== false || reality.result?.readOnly !== true) throw new Error('REALITY_SCREEN_FAILED');
          if (reality.result?.createsTruth !== false || reality.result?.createsAuthority !== false) throw new Error('REALITY_SCREEN_SCOPE_EXPANSION');
          if (!big.ok || big.mutated !== false || big.result?.readOnly !== true) throw new Error('BIG_VIEW_FAILED');
          if (big.result?.createsTruth !== false || big.result?.createsAuthority !== false) throw new Error('BIG_VIEW_SCOPE_EXPANSION');
          if (!intent.ok || intent.mutated !== false || intent.result?.blocking !== false) throw new Error('INTENT_REVIEW_FAILED');
          if (intent.result?.excess?.status !== 'UNKNOWN') throw new Error('INTENT_REVIEW_EXCESS_INVENTED');
          if (capabilities.result?.layout?.canonicalUnit !== 'WORKBENCH') throw new Error('WORKBENCH_LAYOUT_MANIFEST_FAILED');
          if (capabilities.result?.layout?.experimentalLabs?.join(',') !== 'ROOM-A,ROOM-B,ROOM-C') throw new Error('EXPERIMENTAL_LAB_MANIFEST_FAILED');
          if (!codingStatus.ok || codingStatus.result?.status !== 'ACTIVE') throw new Error('CODING_STATUS_FAILED');
          if (codingStatus.result?.executor?.writeEnabled !== false) throw new Error('CODING_TEST_WRITE_SHOULD_BE_DISABLED');
          if (!codingRead.ok || !codingRead.result?.result?.content?.includes('ERGASTERION')) throw new Error('CODING_READ_FAILED');
          if (!codingSearch.ok || !codingSearch.result?.result?.matches?.length) throw new Error('CODING_SEARCH_FAILED');
          if (floor.result?.workbenches?.runtime?.status !== 'HOST_DEPENDENT') throw new Error('RUNTIME_HOST_TRUTH_FAILED');
          if (runtimeStatus.result?.status !== 'UNAVAILABLE') throw new Error('RUNTIME_EXECUTOR_SHOULD_BE_UNAVAILABLE_IN_TEST_HOST');
          if (!runtimeView.ok || runtimeView.result?.latestObservation?.observationId !== 'OBS-SMOKE') throw new Error('RUNTIME_VIEW_FAILED');
          if (runtimeView.result?.interactions?.[0]?.interactionId !== 'INT-SMOKE') throw new Error('RUNTIME_INTERACTION_READBACK_FAILED');
          if (reality.result?.observed?.latestRuntimeObservation?.observationId !== 'OBS-SMOKE') throw new Error('REALITY_RUNTIME_PROJECTION_FAILED');
          if (big.result?.proof?.latestRuntimeObservation?.observationId !== 'OBS-SMOKE') throw new Error('BIG_RUNTIME_PROJECTION_FAILED');
          NODE

      - name: Read Factory Eye version
        id: factory_eye_meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./browser-adapter/firefox-tab-observer/manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package Firefox Factory Eye XPI
        shell: bash
        env:
          FACTORY_EYE_VERSION: ${{ steps.factory_eye_meta.outputs.version }}
        run: |
          set -euo pipefail
          cd browser-adapter/firefox-tab-observer
          zip -q -X -r "$RUNNER_TEMP/ergasterion-factory-eye-v${FACTORY_EYE_VERSION}.xpi" \
            manifest.json \
            background.js \
            content-observer.js \
            options.html \
            options.js \
            README.md
          unzip -l "$RUNNER_TEMP/ergasterion-factory-eye-v${FACTORY_EYE_VERSION}.xpi"

      - name: Upload Firefox Factory Eye XPI
        uses: actions/upload-artifact@v4
        with:
          name: ergasterion-factory-eye-v${{ steps.factory_eye_meta.outputs.version }}
          path: ${{ runner.temp }}/ergasterion-factory-eye-v${{ steps.factory_eye_meta.outputs.version }}.xpi
          if-no-files-found: error
          retention-days: 14


  factory_eye_lint:
    name: Firefox Factory Eye lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mozilla web-ext lint
        shell: bash
        run: |
          set -euo pipefail
          npx --yes web-ext@10.7.0 lint \
            --source-dir pixie-lab-v1/browser-adapter/firefox-tab-observer \
            --no-config-discovery

  command:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pixie-runtime-command
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore PIXIE runtime state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pixie
          git fetch origin pixie-runtime-state:refs/remotes/origin/pixie-runtime-state
          if git show origin/pixie-runtime-state:.pixie/state.json > .pixie/state.json 2>/dev/null; then
            echo "PIXIE state restored"
          else
            rm -f .pixie/state.json
            echo "PIXIE state not initialized yet"
          fi

      - name: Run PIXIE command
        shell: bash
        env:
          PIXIE_COMMAND_JSON: ${{ inputs.command_json }}
          PIXIE_REQUEST_ID: ${{ inputs.request_id }}
          ERGASTERION_CODING_WRITE: "1"
          ERGASTERION_CODING_GIT_PUSH: "1"
          ERGASTERION_CODING_EXECUTABLES: "npm,node"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -uo pipefail
          set +e
          node pixie-lab-v1/cli.mjs "$PIXIE_COMMAND_JSON" > /tmp/pixie-output.json 2> /tmp/pixie-error.txt
          code=$?
          set -e
          printf '%s' "$code" > /tmp/pixie-exit-code

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          async function read(path) {
            try { return await readFile(path, 'utf8'); } catch { return ''; }
          }

          const rawOutput = await read('/tmp/pixie-output.json');
          const rawError = await read('/tmp/pixie-error.txt');
          const exitCode = Number((await read('/tmp/pixie-exit-code')).trim() || 1);
          let output = null;
          try { output = rawOutput ? JSON.parse(rawOutput) : null; }
          catch { output = rawOutput || null; }

          let command = null;
          try { command = JSON.parse(process.env.PIXIE_COMMAND_JSON || '{}')?.command || null; }
          catch {}

          const result = {
            requestId: process.env.PIXIE_REQUEST_ID,
            command,
            exitCode,
            ok: exitCode === 0 && output?.ok !== false,
            output,
            error: rawError.trim() || null,
            completedAt: new Date().toISOString(),
          };
          await writeFile('/tmp/pixie-last-result.json', JSON.stringify(result, null, 2));
          NODE

      - name: Persist PIXIE runtime state and result
        shell: bash
        env:
          PIXIE_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pixie-state
          git worktree add --force /tmp/pixie-state origin/pixie-runtime-state
          git -C /tmp/pixie-state switch -C pixie-runtime-state origin/pixie-runtime-state
          mkdir -p /tmp/pixie-state/.pixie

          if [ -f .pixie/state.json ]; then
            cp .pixie/state.json /tmp/pixie-state/.pixie/state.json
          fi
          cp /tmp/pixie-last-result.json /tmp/pixie-state/.pixie/last-result.json

          git -C /tmp/pixie-state config user.name "PIXIE Runtime"
          git -C /tmp/pixie-state config user.email "pixie-runtime@users.noreply.github.com"
          git -C /tmp/pixie-state add -f .pixie/last-result.json
          if [ -f /tmp/pixie-state/.pixie/state.json ]; then
            git -C /tmp/pixie-state add -f .pixie/state.json
          fi

          if ! git -C /tmp/pixie-state diff --cached --quiet; then
            git -C /tmp/pixie-state commit -m "pixie: persist runtime request $PIXIE_REQUEST_ID"
            git -C /tmp/pixie-state push origin HEAD:pixie-runtime-state
          fi

      - name: Propagate PIXIE command result
        shell: bash
        run: |
          code="$(cat /tmp/pixie-exit-code)"
          exit "$code"
